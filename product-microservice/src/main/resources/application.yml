server:
  port: 8081
spring:
  application:
    name: product
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  datasource:
    url: 'jdbc:h2:mem:productsdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  # Section 14: RabbitMQ for Spring Cloud Stream. In docker-compose: SPRING_RABBITMQ_HOST=rabbitmq
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
    connection-timeout: 10s
  cloud:
    function:
      definition: updateCommunication
    stream:
      bindings:
        sendCommunication-out-0:
          destination: send-communication
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
    openfeign:
      circuitbreaker:
        enabled: true
    config:
      enabled: true
    discovery:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: "${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}"
  instance:
    prefer-ip-address: true
    hostname: localhost
management:
  endpoints:
    web:
      exposure:
        include: '*'

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
