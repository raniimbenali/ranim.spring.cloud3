spring:
  application:
    name: brand
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  datasource:
    # PDF 07: MySQL (docker container "mysqldb"). In docker-compose: SPRING_DATASOURCE_URL points to mysqldb
    url: 'jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
    username: root
    password: root
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true
  # Section 11: Cloud Bus RabbitMQ is disabled on Brand. Events are handled by Product and Message.
  # rabbitmq:
  #   host: "localhost"
  #   port: 5672
  #   username: "guest"
  #   password: "guest"
eureka:
  client:
    service-url:
      defaultZone: "${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}"
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
