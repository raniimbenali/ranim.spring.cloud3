server:
  port: 9010
spring:
  application:
    name: "message"
  cloud:
    function:
      # Final course wiring: email then sms. HTTP path of the composition is /email,sms
      definition: email|sms
    stream:
      bindings:
        emailsms-in-0:
          destination: send-communication
          group: ${spring.application.name}
        emailsms-out-0:
          destination: communication-sent
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s
